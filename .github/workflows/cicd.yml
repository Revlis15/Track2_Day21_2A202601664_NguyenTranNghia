name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
      - '.github/workflows/cicd.yml'
  workflow_dispatch:

jobs:

  # JOB 1: Chay unit tests tren du lieu ao (khong can cloud storage)
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "setuptools<71"

      - name: Run tests
        run: pytest tests/ -v

  # JOB 2: Huan luyen mo hinh tren du lieu thuc, upload artifact
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install "setuptools<71"

      - name: Authenticate to Cloud Storage (if credentials provided)
        run: |
          if [ -n "${{ secrets.STORAGE_CREDENTIALS }}" ]; then
            echo '${{ secrets.STORAGE_CREDENTIALS }}' > /tmp/sa-key.json
            echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV
          fi

      - name: Pull data with DVC
        run: |
          dvc config core.no_scm true
          dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc || true
          if [ ! -f "data/train_batch1.csv" ]; then
            python prepare_data.py
          fi

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          f1_val=$(python -c 'import json; print(json.load(open("outputs/report.json"))["f1_score"])')
          echo "f1=$f1_val" >> $GITHUB_OUTPUT
          echo "Current F1 Score: $f1_val"

      - name: Upload model to Cloud Storage
        run: |
          python - <<'PYEOF'
          import os
          from google.cloud import storage

          bucket_name = "${{ secrets.ARTIFACT_BUCKET }}"
          if not bucket_name:
              bucket_name = "income-mlops-vinaitc-2a202601664"
          
          try:
              if os.path.exists("/tmp/sa-key.json"):
                  client = storage.Client.from_service_account_json("/tmp/sa-key.json")
              else:
                  client = storage.Client.create_anonymous_client()
              
              bucket = client.bucket(bucket_name)
              blob = bucket.blob("artifacts/current/model.joblib")
              blob.upload_from_filename("models/model.joblib")
              print(f"Uploaded model.joblib to gs://{bucket_name}/artifacts/current/model.joblib")
          except Exception as e:
              print(f"[WARN] Could not upload directly via GCS SDK ({e}). Model will be synced via deploy step.")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: |
            outputs/report.json
            outputs/detail.txt
            models/model.joblib

  # JOB 3: Kiem tra chat luong (Quality Gate) - f1_score >= 0.65
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check quality gate (F1 >= 0.65)
        run: |
          python - <<'PYEOF'
          import sys
          f1 = float("${{ needs.train.outputs.f1 }}")
          threshold = 0.65
          print(f"Checking Quality Gate: F1 = {f1:.4f} (Threshold = {threshold})")
          if f1 < threshold:
              print(f"FAILED: F1 score {f1:.4f} is below quality threshold {threshold}!")
              sys.exit(1)
          print("PASSED: F1 score meets the quality requirement.")
          PYEOF

  # JOB 4: Trien khai sau khi Quality Gate qua
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy and restart service on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            echo "Deploying new model on VM..."
            sudo systemctl restart income-api
            sleep 5
            curl -f http://127.0.0.1:8080/healthz || exit 1
            echo "Deploy successful!"
